# macOS ships first; Windows is configured so it is a build away, not a port.
appId: app.momentreel.desktop
productName: Momentreel
copyright: Copyright © Momentreel

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

# Child processes cannot exec or read from inside app.asar
asarUnpack:
  - dist/bridge.js
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**
  - node_modules/@napi-rs/**
  - node_modules/@vladmandic/face-api/model/**
  - node_modules/@tensorflow/tfjs-backend-wasm/dist/*.wasm

extraResources:
  # yt-dlp and whisper-cli per platform, filled by `pnpm fetch-binaries`
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
    filter: ["**/*", "!.gitkeep"]
  - from: ../public/fonts/captions
    to: fonts/captions

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what electron-updater downloads on macOS
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarisation read CSC_LINK / CSC_KEY_PASSWORD and
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the environment
  notarize: true

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false

# Updates are served from a plain HTTPS folder (latest-mac.yml + the zips), so
# they do not depend on where the code is hosted or who sells the licence.
publish:
  provider: generic
  url: https://downloads.momentreel.app/desktop/${os}
